<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnsiteDesk - Queue Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col md:flex-row">

  <aside class="w-full md:w-64 bg-white border-r border-gray-200 flex flex-col justify-between p-5 shrink-0">
    <div>
      <p class="text-[11px] font-bold tracking-widest text-emerald-700 uppercase">Service Desk</p>
      <h1 class="text-xl font-bold text-gray-900 mt-0.5 mb-6">Ticket queue</h1>
      <nav class="space-y-1.5 text-sm">
        <button onclick="switchView('queue')" id="navQueueBtn" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg bg-emerald-50 text-emerald-900 font-semibold">
          <span>📥 Queue</span><span id="sidebarActiveCount" class="text-xs bg-emerald-700 text-white px-2 py-0.5 rounded-full">0</span>
        </button>
        <button onclick="switchView('settings')" id="navSettingsBtn" class="w-full flex items-center px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition"><span>⚙️ QM Settings</span></button>
        <button onclick="exportCSV()" class="w-full text-left flex items-center px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition"><span>📊 Export CSV</span></button>
      </nav>
    </div>
    <div class="pt-4 mt-6 border-t border-gray-100">
      <p class="text-sm font-bold text-gray-900" id="qmName">Loading...</p>
      <button onclick="signOut()" class="mt-2 text-xs font-medium text-red-600 hover:underline">↪ Sign out</button>
    </div>
  </aside>

  <main id="queueView" class="flex-1 p-5 md:p-8 overflow-y-auto">
    <div class="flex flex-wrap justify-between items-center gap-3 mb-5">
      <h2 class="text-2xl font-bold text-gray-900">Ticket queue</h2>
      <div class="flex bg-white border border-gray-200 rounded-full p-1 text-xs font-medium gap-1" id="timeFilterContainer">
        <button onclick="setTimeFilter('all')" data-time="all" class="time-pill px-3 py-1 rounded-full bg-emerald-800 text-white">All time</button>
        <button onclick="setTimeFilter('today')" data-time="today" class="time-pill px-3 py-1 rounded-full text-gray-600 hover:bg-gray-100 transition">Today</button>
      </div>
    </div>

    <!-- DYNAMIC TEAM STATUS -->
    <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-6">
      <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-600">👷 Live Team Status (Auto Detect)</h3>
      </div>
      <div id="teamStatusGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5"></div>
    </div>

    <!-- KPI CARDS -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div onclick="setStatusFilter('New')" class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm cursor-pointer hover:border-blue-400 transition">
        <p class="text-xs font-semibold text-gray-400 uppercase">NEW</p><p class="text-3xl font-bold text-blue-600 mt-1" id="statNew">0</p>
      </div>
      <div onclick="setStatusFilter('In progress')" class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm cursor-pointer hover:border-amber-400 transition">
        <p class="text-xs font-semibold text-gray-400 uppercase">ACTIVE (TECH)</p><p class="text-3xl font-bold text-amber-600 mt-1" id="statProgress">0</p>
      </div>
      <div onclick="setStatusFilter('Resolved')" class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm cursor-pointer hover:border-purple-400 transition">
        <p class="text-xs font-semibold text-gray-400 uppercase">RESOLVED</p><p class="text-3xl font-bold text-purple-600 mt-1" id="statResolved">0</p>
      </div>
      <div onclick="setStatusFilter('Completed')" class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm cursor-pointer hover:border-emerald-400 transition">
        <p class="text-xs font-semibold text-gray-400 uppercase">COMPLETED (QM)</p><p class="text-3xl font-bold text-emerald-700 mt-1" id="statCompleted">0</p>
      </div>
    </div>

    <div class="flex flex-wrap gap-1.5 mb-4 text-xs font-medium" id="statusPills">
      <button onclick="setStatusFilter('All')" data-status="All" class="status-pill px-3 py-1.5 rounded-full border bg-emerald-800 text-white">All</button>
      <button onclick="setStatusFilter('New')" data-status="New" class="status-pill px-3 py-1.5 rounded-full border bg-white text-gray-600">New</button>
      <button onclick="setStatusFilter('In progress')" data-status="In progress" class="status-pill px-3 py-1.5 rounded-full border bg-white text-gray-600">Active</button>
      <button onclick="setStatusFilter('Resolved')" data-status="Resolved" class="status-pill px-3 py-1.5 rounded-full border bg-white text-gray-600">Resolved</button>
      <button onclick="setStatusFilter('Completed')" data-status="Completed" class="status-pill px-3 py-1.5 rounded-full border bg-white text-gray-600">Completed</button>
    </div>

    <div id="ticketsContainer" class="space-y-3"></div>
  </main>

  <main id="settingsView" class="hidden flex-1 p-5 md:p-8">
    <div class="max-w-md bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
      <h2 class="text-xl font-bold text-gray-900">QM Settings</h2>
      <form id="updateQmForm" class="space-y-4 mt-4">
        <div><label class="block text-sm font-medium">QM Name</label><input type="text" id="setQmName" required class="w-full px-3 py-2 border rounded-lg"></div>
        <div><label class="block text-sm font-medium">QM Phone (Login ID)</label><input type="tel" id="setQmPhone" required class="w-full px-3 py-2 border rounded-lg"></div>
        <div><label class="block text-sm font-medium">Password</label><input type="text" id="setQmPassword" required class="w-full px-3 py-2 border rounded-lg"></div>
        <button type="submit" class="w-full bg-emerald-800 text-white font-semibold py-2.5 rounded-lg">Save Settings</button>
      </form>
    </div>
  </main>

  <script>
    const DB_URLS = ["https://onsitedesk-3833b-default-rtdb.asia-southeast1.firebasedatabase.app", "https://onsitedesk-3833b-default-rtdb.firebaseio.com"];
    let activeDbUrl = localStorage.getItem("firebaseActiveUrl") || DB_URLS[0];
    async function dbFetch(path, options = {}) {
      for (const baseUrl of DB_URLS) { try { const res = await fetch(`${baseUrl}${path}`, options); if (res.ok) return await res.json(); } catch (e) {} } throw new Error("DB error.");
    }

    let currentQm = null, allTickets = [], onsiteTeam = [];
    let activeStatusFilter = "All", activeTimeFilter = "all", onlyUrgent = false;
    const priorityWeight = { "Urgent": 1, "Medium": 2, "Low": 3 };

    window.onload = async () => {
      const saved = localStorage.getItem("qmSession");
      if (!saved) return window.location.href = "index.html";
      currentQm = JSON.parse(saved);
      document.getElementById("qmName").innerText = currentQm.name;
      document.getElementById("setQmName").value = currentQm.name; document.getElementById("setQmPhone").value = currentQm.phone; document.getElementById("setQmPassword").value = currentQm.password;
      await syncAllData(); setInterval(syncAllData, 4000);
    };

    async function syncAllData() {
      try {
        const [ticketsData, teamData] = await Promise.all([dbFetch(`/tickets.json`), dbFetch(`/onsiteTeam.json`)]);
        allTickets = ticketsData ? Object.values(ticketsData).sort((a, b) => {
          if (a.status === "Completed" && b.status !== "Completed") return 1; 
          if (a.status !== "Completed" && b.status === "Completed") return -1;
          const pDiff = (priorityWeight[a.urgency] || 99) - (priorityWeight[b.urgency] || 99);
          return pDiff !== 0 ? pDiff : (b.timestamp || 0) - (a.timestamp || 0);
        }) : [];
        
        let rawTeam = teamData ? Object.values(teamData) : [];
        onsiteTeam = rawTeam.map(tech => {
          // Check if tech name exists in the comma-separated string!
          tech.activeTasks = allTickets.filter(t => t.assignedTo && t.assignedTo.split(',').map(s=>s.trim()).includes(tech.name) && t.status === "In progress").length;
          tech.isBusy = tech.activeTasks > 0; return tech;
        }).sort((a, b) => (a.isBusy === b.isBusy ? 0 : a.isBusy ? 1 : -1));

        renderTeamAvailability(); updateMetrics(); renderTickets();
      } catch (err) {}
    }

    function renderTeamAvailability() {
      const grid = document.getElementById("teamStatusGrid");
      if (onsiteTeam.length === 0) return grid.innerHTML = `<p class="text-xs text-gray-400 col-span-3">No technicians registered.</p>`;
      grid.innerHTML = onsiteTeam.map((tech) => {
        const cardStyle = !tech.isBusy ? "bg-emerald-50 border-emerald-300 text-emerald-900" : "bg-red-50 border-red-300 text-red-900";
        return `
          <div class="p-3 rounded-xl border ${cardStyle} flex justify-between items-start text-xs">
            <div>
              <div class="flex items-center gap-1.5"><span class="font-bold">${!tech.isBusy ? "🟢" : "🔴"} ${tech.name}</span></div>
              <p class="text-[10px] mt-1">${!tech.isBusy ? "Free (No active task)" : `Busy (${tech.activeTasks} active task)`}</p>
            </div>
            <span class="font-bold uppercase text-[10px] px-2 py-0.5 rounded bg-white/80 border">${!tech.isBusy ? "AVAILABLE" : "BUSY"}</span>
          </div>
        `;
      }).join("");
    }

    function filterByTime(list) {
      if (activeTimeFilter === "today") return list.filter(t => t.timestamp && new Date(t.timestamp).toDateString() === new Date().toDateString());
      return list;
    }

    function updateMetrics() {
      const filtered = filterByTime(allTickets);
      document.getElementById("statNew").innerText = filtered.filter(t => t.status === "New").length;
      document.getElementById("statProgress").innerText = filtered.filter(t => t.status === "In progress").length;
      document.getElementById("statResolved").innerText = filtered.filter(t => t.status === "Resolved").length;
      document.getElementById("statCompleted").innerText = filtered.filter(t => t.status === "Completed").length;
      document.getElementById("sidebarActiveCount").innerText = filtered.filter(t => t.status === "New" || t.status === "In progress").length;
    }

    function renderTickets() {
      const container = document.getElementById("ticketsContainer");
      let list = filterByTime(allTickets);
      if (onlyUrgent) list = list.filter(t => t.urgency === "Urgent" && t.status !== "Completed");
      else if (activeStatusFilter !== "All") list = list.filter(t => t.status === activeStatusFilter);
      if (list.length === 0) return container.innerHTML = `<div class="bg-white p-8 rounded-xl border text-center text-sm text-gray-400">No tickets found.</div>`;

      container.innerHTML = list.map(t => {
        const urgBadge = t.urgency === "Urgent" ? "bg-red-600 text-white" : t.urgency === "Medium" ? "bg-orange-500 text-white" : "bg-emerald-100 text-emerald-800";
        const statBadge = t.status === "New" ? "bg-blue-100 text-blue-800" 
                        : t.status === "In progress" ? "bg-amber-100 text-amber-800" 
                        : t.status === "Resolved" ? "bg-purple-100 text-purple-800" 
                        : "bg-emerald-100 text-emerald-800";

        // Logic Checkbox / Multi-assign
        const assignedArray = (t.assignedTo && t.assignedTo !== "UNASSIGNED") ? t.assignedTo.split(',').map(s=>s.trim()) : [];
        
        // Chip badges untuk Tech yang dah di-assign
        const assignedChipsHtml = assignedArray.map(name => `
          <span class="bg-emerald-100 text-emerald-800 border border-emerald-200 px-2 py-1 rounded text-xs font-bold flex items-center gap-1">
            ${name} 
            <button onclick="removeTechFromTicket('${t.id}', '${name}')" class="text-emerald-900 hover:text-red-600 font-bold ml-1" title="Remove">×</button>
          </span>
        `).join('');

        // Dropdown untuk tambah Tech baru yang belum ada dalam tiket ni
        const availableToAddOptions = onsiteTeam.filter(tech => !assignedArray.includes(tech.name)).map(tech => {
          const label = !tech.isBusy ? `🟢 ${tech.name}` : `🔴 ${tech.name} (BUSY)`;
          return `<option value="${tech.name}">${label}</option>`;
        }).join("");

        return `
          <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm space-y-3">
            <div class="flex justify-between items-center gap-2">
              <div class="flex items-center gap-2 text-xs text-gray-500"><span class="font-bold text-gray-900">#${t.id}</span><span>•</span><span class="font-semibold text-emerald-800">${t.type}</span></div>
              <div class="flex items-center gap-2">
                <select onchange="updateTicketField('${t.id}', 'urgency', this.value)" class="text-xs font-bold px-2.5 py-1 rounded border ${urgBadge} cursor-pointer focus:outline-none">
                  <option value="Low" class="bg-white text-gray-800" ${t.urgency === "Low" ? "selected" : ""}>Low (8H)</option>
                  <option value="Medium" class="bg-white text-gray-800" ${t.urgency === "Medium" ? "selected" : ""}>Medium (5H)</option>
                  <option value="Urgent" class="bg-white text-gray-800" ${t.urgency === "Urgent" ? "selected" : ""}>Urgent (3H)</option>
                </select>
                <span class="text-xs font-semibold px-2.5 py-1 rounded ${statBadge}">${t.status}</span>
              </div>
            </div>

            <div>
              <div class="flex items-center gap-2"><h3 class="text-base font-bold text-gray-900">${t.name}</h3><a href="https://wa.me/${t.phone}" target="_blank" class="text-xs text-emerald-700 hover:underline">💬 +${t.phone}</a></div>
              <p class="text-sm text-gray-700 mt-1">${t.details}</p>
              
              <div class="flex flex-wrap gap-2 mt-2">
                ${t.imageUrl ? `<a href="${t.imageUrl}" target="_blank" class="text-[11px] font-bold text-blue-700 bg-blue-50 px-2 py-1 rounded border border-blue-200">📷 Problem Image</a>` : ""}
                ${t.proofImageUrl ? `<a href="${t.proofImageUrl}" target="_blank" class="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-1 rounded border border-emerald-200">✅ Proof Image</a>` : ""}
              </div>
              ${t.resolutionNote ? `<p class="text-xs text-emerald-800 bg-emerald-50 p-2 rounded mt-2 border border-emerald-100">📝 <b>Tech Note:</b> ${t.resolutionNote}</p>` : ""}
              
              <div class="text-[10px] text-gray-400 mt-2 flex flex-col gap-0.5">
                <span>Created: ${t.createdAt}</span>
                ${t.resolvedAt && t.resolvedAt !== "-" ? `<span>Resolved: ${t.resolvedAt}</span>` : ""}
              </div>
            </div>

            <div class="pt-3 border-t border-gray-100 flex flex-wrap justify-between items-start gap-3 text-xs">
              
              <!-- MULTIPLE ASSIGNMENT UI -->
              <div class="flex flex-col gap-1.5 w-full sm:w-auto">
                <span class="font-semibold text-gray-500">Assigned Techs:</span>
                <div class="flex flex-wrap items-center gap-1.5">
                  ${assignedChipsHtml || '<span class="text-xs italic text-gray-400">Unassigned</span>'}
                  <select onchange="addTechToTicket('${t.id}', this.value); this.value='';" class="border border-gray-300 rounded px-2 py-1.5 bg-gray-50 font-semibold focus:outline-none">
                    <option value="">+ Add Tech</option>
                    ${availableToAddOptions}
                  </select>
                </div>
              </div>

              <div class="flex items-center gap-1.5 mt-2 sm:mt-0">
                ${t.status === "Resolved" ? `<button onclick="markAsCompleted('${t.id}')" class="bg-emerald-700 hover:bg-emerald-800 text-white font-semibold px-3 py-1.5 rounded-lg shadow-sm transition">✅ Verify & Complete</button>` : ""}
                <button onclick="deleteTicket('${t.id}')" class="text-gray-400 hover:text-red-600 px-2 py-1">🗑️ Delete</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    // FUNGSI TAMBAH TECH
    async function addTechToTicket(ticketId, techName) {
      if (!techName) return;
      const t = allTickets.find(x => x.id === ticketId);
      const tech = onsiteTeam.find(x => x.name === techName);
      if (!t || !tech) return;

      let assignedList = (t.assignedTo && t.assignedTo !== "UNASSIGNED") ? t.assignedTo.split(',').map(s=>s.trim()) : [];
      let phoneList = (t.assignedPhone && t.assignedPhone !== "") ? t.assignedPhone.toString().split(',').map(s=>s.trim()) : [];

      if (!assignedList.includes(tech.name)) {
        assignedList.push(tech.name);
        phoneList.push(tech.phone);
      }

      const updates = [
        dbFetch(`/tickets/${ticketId}/assignedTo.json`, { method: "PUT", body: JSON.stringify(assignedList.join(', ')) }),
        dbFetch(`/tickets/${ticketId}/assignedPhone.json`, { method: "PUT", body: JSON.stringify(phoneList.join(', ')) })
      ];
      
      if (t.status === "New") updates.push(dbFetch(`/tickets/${ticketId}/status.json`, { method: "PUT", body: JSON.stringify("In progress") }));
      await Promise.all(updates); syncAllData();
    }

    // FUNGSI BUANG TECH
    async function removeTechFromTicket(ticketId, techName) {
      const t = allTickets.find(x => x.id === ticketId);
      if (!t) return;

      let assignedList = (t.assignedTo && t.assignedTo !== "UNASSIGNED") ? t.assignedTo.split(',').map(s=>s.trim()) : [];
      let phoneList = (t.assignedPhone && t.assignedPhone !== "") ? t.assignedPhone.toString().split(',').map(s=>s.trim()) : [];

      const index = assignedList.indexOf(techName);
      if (index > -1) {
        assignedList.splice(index, 1);
        phoneList.splice(index, 1);
      }

      const newAssignedTo = assignedList.length > 0 ? assignedList.join(', ') : "UNASSIGNED";
      const newPhone = phoneList.length > 0 ? phoneList.join(', ') : "";

      const updates = [
        dbFetch(`/tickets/${ticketId}/assignedTo.json`, { method: "PUT", body: JSON.stringify(newAssignedTo) }),
        dbFetch(`/tickets/${ticketId}/assignedPhone.json`, { method: "PUT", body: JSON.stringify(newPhone) })
      ];

      if (newAssignedTo === "UNASSIGNED") updates.push(dbFetch(`/tickets/${ticketId}/status.json`, { method: "PUT", body: JSON.stringify("New") }));
      await Promise.all(updates); syncAllData();
    }

    async function markAsCompleted(id) {
      if (confirm(`Confirm that ticket #${id} has been fully verified and should be closed?`)) {
        await dbFetch(`/tickets/${id}/status.json`, { method: "PUT", body: JSON.stringify("Completed") }); syncAllData();
      }
    }

    async function updateTicketField(id, field, value) { await dbFetch(`/tickets/${id}/${field}.json`, { method: "PUT", body: JSON.stringify(value) }); syncAllData(); }
    async function deleteTicket(id) { if (confirm(`Are you sure you want to delete ticket #${id}?`)) { await dbFetch(`/tickets/${id}.json`, { method: "DELETE" }); syncAllData(); } }
    
    function setStatusFilter(status) { onlyUrgent = false; activeStatusFilter = status; document.querySelectorAll(".status-pill").forEach(btn => btn.className = btn.dataset.status === status ? "status-pill px-3 py-1.5 rounded-full border bg-emerald-800 text-white" : "status-pill px-3 py-1.5 rounded-full border bg-white text-gray-600"); renderTickets(); }
    function setUrgentFilter() { onlyUrgent = true; renderTickets(); }
    
    function setTimeFilter(range) { 
      activeTimeFilter = range; 
      document.querySelectorAll(".time-pill").forEach(btn => btn.className = btn.dataset.time === range ? "time-pill px-3 py-1 rounded-full bg-emerald-800 text-white" : "time-pill px-3 py-1 rounded-full text-gray-600 hover:bg-gray-100 transition"); 
      updateMetrics(); renderTickets(); 
    }
    
    function switchView(view) { document.getElementById("queueView").classList.toggle("hidden", view !== 'queue'); document.getElementById("settingsView").classList.toggle("hidden", view === 'queue'); }
    
    document.getElementById("updateQmForm").addEventListener("submit", async (e) => {
      e.preventDefault(); let cleanedPhone = document.getElementById("setQmPhone").value.replace(/\D/g, ''); if (cleanedPhone.startsWith('0')) cleanedPhone = '6' + cleanedPhone;
      const updatedQm = { name: document.getElementById("setQmName").value.trim(), phone: cleanedPhone, password: document.getElementById("setQmPassword").value, updatedAt: new Date().toISOString() };
      await dbFetch(`/qmAdmin.json`, { method: "PUT", body: JSON.stringify(updatedQm) }); currentQm = updatedQm; localStorage.setItem("qmSession", JSON.stringify(updatedQm)); updateSidebarProfile(); alert("Settings updated successfully!");
    });

    function exportCSV() {
      if (allTickets.length === 0) return alert("No tickets available to export.");
      const headers = ["Ticket ID", "Requester", "Phone", "Type", "Sub-Category", "SLA", "Status", "Assigned Techs", "Created At", "Resolved At", "Details", "Resolution Note"];
      const rows = allTickets.map(t => [
        t.id, `"${(t.name || '').replace(/"/g, '""')}"`, t.phone, `"${(t.type || '').replace(/"/g, '""')}"`, `"${(t.subCategory || '').replace(/"/g, '""')}"`, t.urgency, t.status,
        `"${(t.assignedTo || '').replace(/"/g, '""')}"`, // Nama Tech (boleh jadi 2-3 orang)
        `"${t.createdAt || ''}"`, `"${t.resolvedAt && t.resolvedAt !== '-' ? t.resolvedAt : ''}"`,
        `"${(t.details || '').replace(/"/g, '""').replace(/\n/g, ' ')}"`, `"${(t.resolutionNote || '').replace(/"/g, '""').replace(/\n/g, ' ')}"`
      ]);

      const csvContent = [headers.join(","), ...rows.map(row => row.join(","))].join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.setAttribute("href", URL.createObjectURL(blob));
      link.setAttribute("download", `OnsiteDesk_Report_${new Date().toISOString().slice(0,10)}.csv`);
      link.style.visibility = 'hidden'; document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }
    function signOut() { localStorage.removeItem("qmSession"); window.location.href = "index.html"; }
  </script>
</body>
</html>
