<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnsiteDesk - QM Leader Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-950 text-gray-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white p-6 md:p-8 rounded-xl shadow-lg border border-gray-200">
    <!-- Header -->
    <div class="text-center mb-6">
      <span class="px-3 py-1 text-[11px] font-bold tracking-wider text-emerald-900 bg-emerald-100 rounded-full uppercase">
        Restricted Access • QM Only
      </span>
      <h1 id="pageTitle" class="text-2xl font-bold text-gray-900 mt-3">Queue Manager Sign In</h1>
      <p id="pageSubtitle" class="text-sm text-gray-500 mt-1">Checking database configuration...</p>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-medium"></div>

    <!-- ================= 1. SIGN IN FORM (DEFAULT) ================= -->
    <form id="qmLoginForm" class="hidden space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">QM Leader WhatsApp Number</label>
        <input type="tel" id="loginPhone" required placeholder="60123456789"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <button type="submit" id="loginBtn"
        class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-semibold py-2.5 rounded-lg transition shadow-sm">
        Sign In as Queue Manager
      </button>
    </form>

    <!-- ================= 2. ONE-TIME INITIAL SETUP FORM ================= -->
    <!-- Only appears if /qmAdmin does NOT exist in Firebase yet -->
    <form id="qmSetupForm" class="hidden space-y-4">
      <div class="p-3 bg-amber-50 border border-amber-200 rounded-lg text-xs text-amber-900">
        <b>First-Time Setup:</b> No Queue Manager account found in Firebase yet. Set up the single QM Leader account below. Once saved, this setup screen will be permanently locked.
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">QM Leader Name</label>
        <input type="text" id="setupName" required placeholder="e.g. Khairi (Onsite Leader)"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">QM Leader WhatsApp Number</label>
        <input type="tel" id="setupPhone" required placeholder="60123456789"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Set Master Password</label>
        <input type="password" id="setupPassword" required placeholder="••••••••"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <button type="submit" id="setupBtn"
        class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2.5 rounded-lg transition shadow-sm">
        Lock & Activate QM Account
      </button>
    </form>
  </div>

  <script>
    const DB_URLS = [
      "https://onsitedesk-3833b-default-rtdb.asia-southeast1.firebasedatabase.app",
      "https://onsitedesk-3833b-default-rtdb.firebaseio.com"
    ];
    let activeDbUrl = localStorage.getItem("firebaseActiveUrl") || DB_URLS[0];

    async function dbFetch(path, options = {}) {
      for (const baseUrl of [activeDbUrl, ...DB_URLS]) {
        try {
          const res = await fetch(`${baseUrl}${path}`, options);
          if (res.ok) {
            activeDbUrl = baseUrl;
            localStorage.setItem("firebaseActiveUrl", baseUrl);
            return await res.json();
          }
        } catch (e) {}
      }
      throw new Error("Cannot connect to Firebase. Ensure Realtime Database Rules are in Test Mode.");
    }

    function formatPhone(phone) {
      let cleaned = phone.replace(/\D/g, '');
      if (cleaned.startsWith('0')) cleaned = '6' + cleaned;
      else if (!cleaned.startsWith('60')) cleaned = '60' + cleaned;
      return cleaned;
    }

    function showAlert(message, isError = true) {
      const box = document.getElementById("alertBox");
      box.className = `mb-4 p-3 rounded-lg text-xs font-medium border ${
        isError ? "bg-red-50 text-red-700 border-red-200" : "bg-emerald-50 text-emerald-800 border-emerald-200"
      }`;
      box.innerText = message;
      box.classList.remove("hidden");
    }

    // Check if QM session is already active or if /qmAdmin exists in Firebase
    window.onload = async () => {
      if (localStorage.getItem("qmSession")) {
        window.location.href = "qm.html";
        return;
      }

      try {
        const qmAccount = await dbFetch(`/qmAdmin.json`);
        if (qmAccount && qmAccount.phone) {
          // QM Account already exists -> Show Sign In only!
          document.getElementById("pageTitle").innerText = "Queue Manager Sign In";
          document.getElementById("pageSubtitle").innerText = "Authorized Onsite Leader access only";
          document.getElementById("qmLoginForm").classList.remove("hidden");
        } else {
          // No QM Account in Firebase yet -> Show One-Time Setup!
          document.getElementById("pageTitle").innerText = "Initial QM Setup";
          document.getElementById("pageSubtitle").innerText = "Register the single Queue Manager account";
          document.getElementById("qmSetupForm").classList.remove("hidden");
        }
      } catch (err) {
        showAlert(err.message, true);
      }
    };

    // Handle One-Time Setup (Saves /qmAdmin in Firebase)
    document.getElementById("qmSetupForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("setupBtn");
      btn.innerText = "Activating...";
      btn.disabled = true;

      const qmData = {
        name: document.getElementById("setupName").value.trim(),
        phone: formatPhone(document.getElementById("setupPhone").value.trim()),
        password: document.getElementById("setupPassword").value,
        updatedAt: new Date().toISOString()
      };

      try {
        await dbFetch(`/qmAdmin.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(qmData)
        });

        localStorage.setItem("qmSession", JSON.stringify(qmData));
        window.location.href = "qm.html";
      } catch (err) {
        showAlert(err.message, true);
        btn.innerText = "Lock & Activate QM Account";
        btn.disabled = false;
      }
    });

    // Handle QM Sign In (Verifies against /qmAdmin in Firebase)
    document.getElementById("qmLoginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      btn.innerText = "Verifying...";
      btn.disabled = true;

      const phone = formatPhone(document.getElementById("loginPhone").value.trim());
      const password = document.getElementById("loginPassword").value;

      try {
        const qmAccount = await dbFetch(`/qmAdmin.json`);
        if (!qmAccount || qmAccount.phone !== phone || qmAccount.password !== password) {
          showAlert("Access Denied: Invalid QM WhatsApp number or password.", true);
          btn.innerText = "Sign In as Queue Manager";
          btn.disabled = false;
          return;
        }

        localStorage.setItem("qmSession", JSON.stringify(qmAccount));
        window.location.href = "qm.html";
      } catch (err) {
        showAlert(err.message, true);
        btn.innerText = "Sign In as Queue Manager";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
